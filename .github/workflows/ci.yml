name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run pack:check
      - run: npm run smoke
      - name: Load packed extension in Pi
        shell: bash
        run: |
          package_dir=$(mktemp -d)
          trap 'rm -rf "$package_dir"' EXIT
          npm pack --ignore-scripts --pack-destination "$package_dir"
          tar -xzf "$package_dir"/*.tgz -C "$package_dir"
          node scripts/smoke.mjs "$package_dir/package/src/index.ts"
